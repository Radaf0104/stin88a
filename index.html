<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STIN 88A · Interactive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- (M2) Two renderers, one code base. Default: the classic WebGLRenderer on three r170. With ?renderer=webgpu (or
       ?renderer=webgl2 = the same new renderer forced onto its WebGL 2 backend), "three" is the WebGPU build of a newer
       pinned three (WebGPURenderer + TSL node materials). js/gpu.js tells the modules which one is running. -->
  <script>
    (function () {
      var q = location.search, gpu = /[?&]renderer=(webgpu|webgl2)\b/.test(q);
      var v = gpu ? "0.186.1" : "0.170.0", base = "https://cdn.jsdelivr.net/npm/three@" + v;
      var imports = {
        "three": base + (gpu ? "/build/three.webgpu.min.js" : "/build/three.module.min.js"),
        "three/addons/": base + "/examples/jsm/",
        "3d-tiles-renderer/three": "https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.5.4/build/index.three.js",
        "3d-tiles-renderer/plugins": "https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.5.4/build/index.plugins.js"
      };
      if (gpu) { imports["three/webgpu"] = base + "/build/three.webgpu.min.js"; imports["three/tsl"] = base + "/build/three.tsl.min.js"; }
      var s = document.createElement("script");
      s.type = "importmap"; s.textContent = JSON.stringify({ imports: imports });
      document.currentScript.after(s);
    })();
  </script>
  <!-- Start everything the first 3D frame needs at once, instead of one file after another as the code discovers it:
       the model data and the code libraries download in parallel while the cover picture is shown. -->
  <link rel="preload" href="data/model.json" as="fetch" crossorigin />
  <link rel="preload" href="data/units.json" as="fetch" crossorigin />
  <link rel="preload" href="data/room_accents.json" as="fetch" crossorigin />
  <link rel="preload" href="data/cap.q.bin.gz" as="fetch" crossorigin />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js" />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/RGBELoader.js" />
  <link rel="modulepreload" href="js/main.js" />
  <link rel="modulepreload" href="js/materials.js" />
  <link rel="modulepreload" href="js/environment.js" />
  <!-- (round 4 of IMPROVEMENT_LOG.md) the rest of the module tree and the level data: without these the browser only
       finds them one import level at a time (4-5 round trips in a row on a phone) -->
  <link rel="modulepreload" href="js/config.js" />
  <link rel="modulepreload" href="js/gpu.js" />
  <link rel="modulepreload" href="js/materialsTSL.js" />
  <link rel="modulepreload" href="js/lighting.js" />
  <link rel="modulepreload" href="js/massing.js" />
  <link rel="modulepreload" href="js/roomstyle.js" />
  <link rel="modulepreload" href="js/proctex.js" />
  <link rel="modulepreload" href="js/accents.js" />
  <link rel="modulepreload" href="js/map.js" />
  <link rel="modulepreload" href="js/grade.js" />
  <link rel="modulepreload" href="js/isolate.js" />
  <link rel="modulepreload" href="js/spaces.js" />
  <link rel="modulepreload" href="js/luxe.js" />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js" />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/utils/BufferGeometryUtils.js" />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/objects/Sky.js" />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/environments/RoomEnvironment.js" />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/KTX2Loader.js" />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/meshopt_decoder.module.js" />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/utils/WorkerPool.js" />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/zstddec.module.js" />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/ktx-parse.module.js" />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/math/ColorSpaces.js" />
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/basis/basis_transcoder.js" as="fetch" crossorigin />
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/basis/basis_transcoder.wasm" as="fetch" crossorigin />
  <link rel="preload" href="data/levels/L0.gltf" as="fetch" crossorigin />
  <link rel="preload" href="data/levels/L0.bin" as="fetch" crossorigin />
  <link rel="preload" href="data/levels/L1.gltf" as="fetch" crossorigin />
  <link rel="preload" href="data/levels/L1.bin" as="fetch" crossorigin />
  <link rel="preload" href="data/levels/L2.gltf" as="fetch" crossorigin />
  <link rel="preload" href="data/levels/L2.bin" as="fetch" crossorigin />
  <link rel="preload" href="data/levels/L3.gltf" as="fetch" crossorigin />
  <link rel="preload" href="data/levels/L3.bin" as="fetch" crossorigin />
  <link rel="preload" href="data/levels/L4.gltf" as="fetch" crossorigin />
  <link rel="preload" href="data/levels/L4.bin" as="fetch" crossorigin />
  <link rel="preload" href="data/levels/ROOF.gltf" as="fetch" crossorigin />
  <link rel="preload" href="data/levels/ROOF.bin" as="fetch" crossorigin />
  <link rel="preload" href="data/levels/SITEPLAN.gltf" as="fetch" crossorigin />
  <link rel="preload" href="assets/sky/autumn_field_puresky_512.hdr" as="fetch" crossorigin />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>
    <div id="labels"></div>

    <header class="brand">
      <div class="logo" id="projectName">STIN 88A</div>
      <div class="tag" id="tagline"></div>
    </header>

    <!-- (client, 2026-11-27) Back: one step back (room -> level -> overview), outside the panels -->
    <button id="backBtn" class="chip back-btn hidden"></button>

    <aside class="panel floors">
      <button id="floorsHide" class="panel-hide">×</button>
      <button class="overview-btn" id="overviewBtn"></button>
      <div class="panel-title" data-i18n="floors"></div>
      <div id="floorList"></div>
      <div id="roomList"></div>
      <div class="legend" id="legend"></div>
    </aside>

    <section id="card" class="panel card hidden" aria-live="polite"></section>
    <!-- hidden panels come back from these tabs -->
    <button id="floorsTab" class="chip panel-tab floors-tab hidden"></button>
    <button id="cardTab" class="chip panel-tab card-tab hidden"></button>

    <aside id="photoRail" class="photo-rail hidden" aria-label="Renders of this space"></aside>

    <div id="insideBar" class="panel inside-bar hidden">
      <div id="insideTitle"></div>
      <button id="insidePhotos" class="chip"></button>
      <button id="insidePano" class="chip hidden"></button>
      <button id="insideExit" class="chip"></button>
    </div>

    <div class="toolbar">
      <button id="ttBtn" class="chip hidden"></button>
      <button id="galleryBtn" class="chip"></button>
      <button id="dayNight" class="chip"></button>
      <button id="langBtn" class="chip"></button>
    </div>

    <div id="hint" class="hint"></div>
    <div id="mapCredit" class="map-credit"></div>
    <div id="tooltip" class="tooltip hidden"></div>

    <div id="loading"><div class="spinner"></div><div id="loadingText">Loading…</div></div>

    <section id="hero" role="img" aria-busy="true" aria-label="STIN 88A exterior render. Loading the 3D model">
      <picture>
        <source type="image/webp" srcset="images/landing/hero-1200.webp 1200w, images/landing/hero-2000.webp 2000w" sizes="100vw" />
        <img id="heroImg" src="images/landing/hero-2000.jpg" srcset="images/landing/hero-1200.jpg 1200w, images/landing/hero-2000.jpg 2000w" sizes="100vw" width="2000" height="1116" fetchpriority="high" decoding="async" alt="STIN 88A exterior render" draggable="false" />
      </picture>
      <!-- loading bar: real progress (downloads counted here, then the start-up stages reported by js/main.js) -->
      <div class="hero-load" role="progressbar" aria-label="Loading the 3D model" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="hero-head"><span class="hero-name">STIN 88A</span><b id="heroPct">0%</b></div>
        <div class="hero-bar"><i id="heroBar"></i></div>
        <div class="hero-pct"><span class="hero-dot"></span><span id="heroLabel">Loading 3D model</span></div>
      </div>
      <script>
        // Progress before js/main.js runs: each model / texture download that finishes moves the bar (up to 55 %);
        // js/main.js then calls window.__progress(p) at its start-up stages. The bar eases toward the target so it
        // never jumps backwards or looks stuck.
        (function () {
          var bar = document.getElementById("heroBar"), pct = document.getElementById("heroPct"), box = bar.closest(".hero-load");
          var target = 0.04, shown = 0, done = 0, EXPECT = 70;
          window.__progress = function (p) { if (p > target) target = Math.min(1, p); };
          try {
            new PerformanceObserver(function (l) {
              l.getEntries().forEach(function (e) { if (/data\/(levels\/|model|units|room_accents)|assets\/sky/.test(e.name)) done++; });
              window.__progress(0.04 + 0.51 * Math.min(1, done / EXPECT));
            }).observe({ type: "resource", buffered: true });
          } catch (e) {}
          (function tick() {
            shown += (target - shown) * 0.12 + 0.0008 * (target > shown ? 1 : 0); if (shown > target) shown = target;
            var v = Math.round(shown * 100);
            bar.style.transform = "scaleX(" + shown.toFixed(4) + ")"; pct.textContent = v + "%"; box.setAttribute("aria-valuenow", v);
            if (shown < 0.999 || target < 1) requestAnimationFrame(tick);
          })();
        })();
      </script>
    </section>

    <!-- (client, 2026-11-28) view-change veil: fade out / in with a loading bar (js/main.js go()) -->
    <div id="viewFade" aria-hidden="true">
      <div class="vf-card"><span class="vf-name">STIN 88A</span><div class="vf-bar"><i id="vfBar"></i></div></div>
    </div>

    <div id="lightbox" class="hidden" role="dialog" aria-modal="true">
      <img id="lbImg" alt="" />
      <div class="lb-top">
        <div><div id="lbTitle"></div><div id="lbCount"></div></div>
        <div class="lb-actions"><button id="lbAngle" class="chip"></button><button id="lbClose" class="chip"></button></div>
      </div>
      <div id="lbTabs"></div>
      <button id="lbPrev" class="lb-nav prev" aria-label="Previous">‹</button>
      <button id="lbNext" class="lb-nav next" aria-label="Next">›</button>
      <div id="lbThumbs"></div>
    </div>

    <div id="pano" class="hidden" role="dialog" aria-modal="true">
      <canvas id="panoCanvas"></canvas>
      <div class="pano-top">
        <div id="panoTitle"></div>
        <span>
          <button id="panoClose" class="chip"></button>
        </span>
      </div>
      <div id="panoNote"></div>
      <div class="pano-hint" data-i18n="drag"></div>
    </div>
  </div>
  <!-- (2026-11-28, test: ?tt=1) pre-rendered turntables for the building overview and the level views (js/turntable.js),
       started before the live 3D so the first frame can replace the landing picture early -->
  <script type="module">if (/[?&]tt=1\b/.test(location.search)) import("./js/turntable.js").then((m) => m.boot());</script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
